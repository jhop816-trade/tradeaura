name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails the build if package.json and the lockfile
      # have drifted, rather than silently resolving new versions in CI.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build
