name: Upload Calendar Images to Supabase

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install gid dependencies
        working-directory: gid
        run: npm install

      - name: Upload images to Supabase Storage
        working-directory: gid
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node_modules/.bin/tsx src/scripts/uploadImages.ts
